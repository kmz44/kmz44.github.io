<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>KMZ44 - Lyrion AI Assistant</title>
    <meta name='description' content='Descarga Lyrion, el asistente de IA local para Android'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255,255,255,0.2); }
            to { text-shadow: 0 0 30px rgba(255,255,255,0.4); }
        }
        
        .title {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #FFD700;
        }
        
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 20px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            margin: 10px;
        }
        
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
        }
        
        .redirect-info {
            margin-top: 30px;
            padding: 20px;
            background: rgba(46, 204, 113, 0.2);
            border: 2px solid #2ECC71;
            border-radius: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class='container'>
        <div class='logo'></div>
        <h1 class='title'>LYRION</h1>
        <p class='subtitle'>Asistente de IA Local para Android</p>
        
        <a href='lyrion.html' class='btn'>
             Ver Proyecto y Descargar
        </a>
        
        <a href='https://github.com/kmz44/kmz44.github.io/raw/main/Lyrion-v1.0.6-Android15.apk' class='btn btn-secondary'>
             Descarga Directa APK
        </a>
        
        <div class='redirect-info'>
            <strong> Acceso rápido:</strong><br>
            Esta página te llevará directamente a la información de Lyrion y la descarga de la APK.
        </div>
    </div>
    
    <script>
        // Auto-redirección después de 3 segundos si no hay interacción
        let redirectTimer = setTimeout(function() {
            window.location.href = 'lyrion.html';
        }, 5000);
        
        // Cancelar auto-redirección si el usuario interactúa
        document.addEventListener('click', function() {
            clearTimeout(redirectTimer);
        });
        
        document.addEventListener('mousemove', function() {
            clearTimeout(redirectTimer);
        });
    </script>
</body>
</html>
